[project]
name = "dubbing-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask",
]

[project.scripts]
dubbing-cli = "dubbing.__main__:main"
dubbing-web = "dubbing.web:main"

[project.optional-dependencies]
diarization = [
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["dubbing*"]
