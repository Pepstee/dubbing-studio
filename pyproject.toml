[project]
name = "dubbing-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask",
]

[project.scripts]
dubbing-cli = "dubbing.__main__:main"
dubbing-web = "dubbing.web:main"

[project.optional-dependencies]
diarization = [
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
transcription-mlx = [
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
understanding-mac = [
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the repository's historical Ruff profile explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["dubbing*"]
