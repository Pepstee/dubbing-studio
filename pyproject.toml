[project]
name = "dubbing-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask",
]

[project.scripts]
dubbing-cli = "dubbing.__main__:main"
dubbing-gpu = "dubbing.gpu_launcher:main"
dubbing-web = "dubbing.web:main"

[project.optional-dependencies]
diarization = [
    "imageio-ffmpeg>=0.6",
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
transcription-mlx = [
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
transcription-faster = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.6; platform_system == 'Linux'",
    "nvidia-cudnn-cu12>=9.1; platform_system == 'Linux'",
]
understanding-mac = [
    "imageio-ffmpeg>=0.6",
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
understanding-nvidia = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6",
    "nvidia-cublas-cu12>=12.6; platform_system == 'Linux'",
    "nvidia-cudnn-cu12>=9.1; platform_system == 'Linux'",
    "numpy>=1.23",
    "sherpa-onnx>=1.10.28",
]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep the repository's historical Ruff profile explicit across Ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["dubbing*"]
